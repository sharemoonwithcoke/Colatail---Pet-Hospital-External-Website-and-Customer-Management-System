services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: colatail
      POSTGRES_USER: colatail_user
      POSTGRES_PASSWORD: colatail123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colatail_user -d colatail"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/colatail
      SPRING_DATASOURCE_USERNAME: colatail_user
      SPRING_DATASOURCE_PASSWORD: colatail123
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
